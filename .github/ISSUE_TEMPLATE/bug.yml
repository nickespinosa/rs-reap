name: Bug report
description: Report incorrect reaping behavior or platform issues
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Include platform details and a minimal reproduction when possible.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows
        - Solaris
        - Other Unix
        - Other
    validations:
      required: true
  - type: input
    id: rust-version
    attributes:
      label: Rust version
      placeholder: rustc 1.97.1
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened vs what you expected?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal steps or code sample
    validations:
      required: false
