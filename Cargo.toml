[package]
name = "rs-reap"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "A small, cross-platform child-process reaper for PID 1 applications"
license = "MPL-2.0"
readme = "README.md"
repository = "https://github.com/nickespinosa/rs-reap"
homepage = "https://github.com/nickespinosa/rs-reap"
documentation = "https://docs.rs/rs-reap"
keywords = ["process", "reaper", "pid1", "unix"]
categories = ["os", "unix-apis"]
include = ["src/**/*", "Cargo.toml", "LICENSE", "README.md", "rust-toolchain.toml"]

[dependencies]
libc = "0.2"

[target.'cfg(all(unix, not(target_os = "solaris")))'.dependencies]
signal-hook = "0.3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
unused_unsafe = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
cargo = "warn"
manual_let_else = "warn"
redundant_clone = "warn"
trivially_copy_pass_by_ref = "warn"
uninlined_format_args = "warn"
use_self = "warn"
